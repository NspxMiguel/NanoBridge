[project]
name = "nanobridge"
version = "0.6.0"
description = "Gemini's Nano Banana image generation, wired into any agent as a CLI and an MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Miguel Moretti" }]
keywords = ["gemini", "nano-banana", "image-generation", "mcp", "sprites"]

dependencies = [
  # 2.0 mudou a forma de client.quotas e de start_chat; o codigo depende das duas.
  "gemini-webapi>=2.0.0",
  "browser-cookie3>=0.20.1",
  "pillow>=10.0.0",
  "mcp>=1.2.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
nanobridge = "nanobridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanobridge"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # Varrer navegador por navegador só faz sentido engolindo a falha de cada um:
  # perfil trancado, navegador ausente, permissão negada — o próximo da lista
  # pode ter o cookie, e nenhuma dessas é notícia para o usuário.
  "BLE001",
  "S110",
  "S112",
]

[tool.ruff.lint.per-file-ignores]
# O sinal × aparece de propósito: é o que o usuário digita em "4×2", e é como
# se escreve uma dimensão ("2816×1536") num comentário.
"nanobridge/imaging.py" = ["RUF001", "RUF002"]
# Canal falso de teste: atributo mutável de classe é o ponto, e o × idem.
"tests/*" = ["RUF012", "RUF001", "RUF002"]
