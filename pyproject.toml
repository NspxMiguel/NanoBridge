[project]
name = "nanobridge"
version = "0.8.2"
description = "Nano Banana image generation, single-image-to-3D, and a Blender refinement pipeline — as a CLI and an MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "NspxMiguel", email = "miguel@nspx.dev" }]
keywords = ["gemini", "nano-banana", "image-generation", "mcp", "sprites", "image-to-3d", "blender", "retopology"]

dependencies = [
  # 2.0 mudou a forma de client.quotas e de start_chat; o codigo depende das duas.
  "gemini-webapi>=2.0.0",
  "browser-cookie3>=0.20.1",
  "pillow>=10.0.0",
  "mcp>=1.2.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
# O 3D e opcional de proposito: quem so quer sprite 2D nao deve baixar NumPy e
# trimesh atras. `pip install 'nanobridge[3d]'` liga mesh/turntable/sprite3d.
"3d" = ["trimesh>=4.0", "numpy>=1.24", "gradio_client>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "trimesh>=4.0", "numpy>=1.24", "gradio_client>=1.0"]

[project.scripts]
nanobridge = "nanobridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanobridge"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # Varrer navegador por navegador só faz sentido engolindo a falha de cada um:
  # perfil trancado, navegador ausente, permissão negada — o próximo da lista
  # pode ter o cookie, e nenhuma dessas é notícia para o usuário.
  "BLE001",
  "S110",
  "S112",
]

[tool.ruff.lint.per-file-ignores]
# O sinal × aparece de propósito: é o que o usuário digita em "4×2", e é como
# se escreve uma dimensão ("2816×1536") num comentário.
"nanobridge/imaging.py" = ["RUF001", "RUF002"]
"nanobridge/core.py" = ["RUF003"]
# Canal falso de teste: atributo mutável de classe é o ponto, e o × idem.
"tests/*" = ["RUF012", "RUF001", "RUF002"]
